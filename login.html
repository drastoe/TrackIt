<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrackIt — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="landing.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="login.js" defer></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: "#0B1220",
          brandblue: "#2E6FF2",
          brandgreen: "#17B978",
        },
        fontFamily: {
          sora: ["Sora", "sans-serif"],
          inter: ["Inter", "sans-serif"],
        },
      },
    },
  };
</script>
</head>
<body class="font-inter text-white antialiased">
<div class="bg-mesh"></div>

<div class="relative z-10 min-h-screen flex items-start md:items-center md:justify-center px-6">
  <div class="absolute top-6 left-6 hidden md:flex items-center gap-2">
    <img src="Trackit1.png" alt="TrackIt logo" class="rounded-full h-9">
    <span class="bg-gradient-to-r from-brandblue via-brandblue to-brandgreen bg-clip-text text-transparent font-sora font-bold text-xl">TrackIt</span>
  </div>

  <div class="w-full max-w-md py-8">

  <!-- Logo (mobile only) -->
  <div class="flex gap-2 mb-10 md:hidden">
    <span class="bg-gradient-to-r from-brandblue via-brandblue to-brandgreen bg-clip-text text-transparent font-sora font-bold text-xl">TrackIt</span>
  </div>

  <h1 class="font-sora font-bold text-2xl sm:text-3xl mb-2">Welcome back</h1>
  <p class="text-slate-400 text-sm mb-8"><i>Log in to continue to your account</i></p>

  <form id="login-form" method="POST" action="" novalidate>
    <div class="mb-4">
      <label for="email" class="field-label">Email</label>
      <input id="email" name="email" type="email" class="field" placeholder="you@example.com" required />
      <p class="error-text" data-error-for="email">Enter a valid email address</p>
    </div>

    <div class="mb-3 relative">
      <div class="flex items-center justify-between mb-1.5">
        <label class="field-label mb-0" for="password">Password</label>
        <a href="forgot-password.html" class="text-xs text-brandgreen hover:underline">Forgot password?</a>
      </div>
      <input id="password" name="password" type="password" class="field pr-12" placeholder="Enter your password" required />
      <span class="toggle-pass absolute right-4 top-[38px] text-slate-500 text-xs select-none" onclick="togglePassword('password', this)">Show</span>
      <p class="error-text" data-error-for="password">Enter your password</p>
    </div>

    <label class="flex items-center gap-2 mb-7 mt-4 cursor-pointer select-none">
      <input type="checkbox" id="remember-me" class="w-4 h-4 rounded accent-brandgreen" />
      <span class="text-sm text-slate-400">Keep me logged in</span>
    </label>

    <button type="submit" class="btn-primary w-full font-semibold px-6 py-4 rounded-full bg-gradient-to-r from-brandblue to-brandgreen mb-6">
      Log In
    </button>
  </form>

  <div class="flex items-center gap-3 mb-6">
    <span class="divider-line"></span>
    <span class="text-xs text-slate-500">or continue with</span>
    <span class="divider-line"></span>
  </div>

  <div class="grid grid-cols-2 gap-3 mb-8">
    <button type="button" class="btn-social flex items-center justify-center gap-2 py-3 rounded-full border border-white/12 text-sm font-medium">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Google
    </button>
    <button type="button" class="btn-social flex items-center justify-center gap-2 py-3 rounded-full border border-white/12 text-sm font-medium">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="1" y="1" width="7.5" height="7.5" fill="#F25022"/><rect x="9.5" y="1" width="7.5" height="7.5" fill="#7FBA00"/><rect x="1" y="9.5" width="7.5" height="7.5" fill="#00A4EF"/><rect x="9.5" y="9.5" width="7.5" height="7.5" fill="#FFB900"/></svg>
      Microsoft
    </button>
  </div>

  <p class="text-center text-sm text-slate-400 mt-auto pt-4">
    Don't have an account?
    <a href="signup.html" class="text-brandgreen font-medium hover:underline">Sign up</a>
  </p>

  </div>

    <linearGradient id="paint0_linear" x1="12" y1="50" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0089FF"/>
      <stop offset="1" stop-color="#1DD75F"/>
    </linearGradient>
  </defs>
  <path d="M50 10C32.8 10 19 23.8 19 41C19 56.3 31.8 74.1 50 92.5C68.2 74.1 81 56.3 81 41C81 23.8 67.2 10 50 10ZM50 65C39.5 65 31 56.5 31 46C31 35.5 39.5 27 50 27C60.5 27 69 35.5 69 46C69 56.5 60.5 65 50 65Z" fill="url(#paint0_linear)"/>
  <path d="M36 44.8L45.2 54L64.8 34" stroke="#1DD75F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M25 74L37.3 61.3L49.6 65.6L62 50" stroke="url(#paint0_linear)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25" cy="74" r="3" fill="#0089FF"/>
  <circle cx="37" cy="61" r="3" fill="#0089FF"/>
  <circle cx="50" cy="66" r="3" fill="#1DD75F"/>
  <circle cx="62" cy="50" r="3" fill="#1DD75F"/>
</svg>
</div>


</body>
</html>
