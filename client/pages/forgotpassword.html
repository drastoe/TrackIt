<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackIt — Reset Your Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/forgotpassword.css" />
  <script src="../js/forgotpassword.js" defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: "#0B1220",
            brandblue: "#2E6FF2",
            brandgreen: "#17B978",
          },
          fontFamily: {
            sora: ["Sora", "sans-serif"],
            inter: ["Inter", "sans-serif"],
          },
        },
      },
    };
  </script>
</head>
<body class="font-inter text-white antialiased">

<div class="bg-mesh"></div>

<div class="relative z-10 min-h-screen flex items-center justify-center px-6 py-8">

  <!-- top-left logo -->
  <div class="absolute top-4 left-4 flex items-center gap-2">
    <span class="bg-gradient-to-r from-brandblue via-brandblue to-brandgreen bg-clip-text text-transparent font-sora font-bold text-xl">TrackIt</span>
  </div>

  <div class="w-full max-w-md pt-10 md:pt-0 py-8">

  <!-- STATE 1: Request reset -->
  <div id="request-view" class="state-view active">
   
    <h1 class="font-sora font-bold text-2xl tracking-wide sm:text-3xl mb-2">Forgot your password?</h1>
    <p class="text-slate-400 text-sm mb-8 leading-relaxed">Enter the email on your account and we'll send you a link to reset it.</p>

    <form id="reset-form" method="post" action="" novalidate>
      <div class="mb-6">
        <label class="field-label" for="reset-email">Email</label>
        <input id="reset-email" name="email" type="email" class="field" placeholder="you@example.com" required />
        <p class="error-text" data-error-for="reset-email">Enter a valid email address</p>
      </div>

      <button type="submit" class="btn-primary w-full font-semibold px-6 py-4 rounded-full bg-gradient-to-r from-brandblue to-brandgreen">
        Send reset link
      </button>
       <a href="./login.html" class="inline-flex mt-5 items-center gap-1.5 text-sm text-slate-400 hover:text-white transition mb-6">
      &larr; Back to log in
    </a>
    </form>
  </div>

  <!-- STATE 2: Confirmation -->
  <div id="confirm-view" class="state-view hidden flex flex-col items-center text-center pt-7">
      <div class="icon-orb w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-8">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3ddb9a" stroke-width="1.8">
        <rect x="3" y="5" width="18" height="14" rx="2.5" stroke-linejoin="round"/>
        <path d="M3 7l9 6 9-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="font-sora font-bold text-2xl sm:text-3xl mb-3">Check your email</h1>
  
    <p class="text-slate-400 text-sm mb-3 leading-relaxed max-w-xs mx-auto">We've sent a password reset link to</p>
    <p class="font-semibold text-white mb-8" id="sent-to-email">you@example.com</p>

    <p class="text-sm text-slate-500 mb-8">
      Didn't get it?
      <button id="resend-btn" class="resend-link text-brandgreen font-medium hover:underline">Resend email</button>
    </p>
    <a href="./login.html" class="btn-ghost w-full text-center font-semibold px-6 py-4 rounded-full border border-white/15 text-slate-200">
      Back to log in
    </a>
  </div>

  </div>

</div>



</body>
</html>
