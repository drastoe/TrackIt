<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrackIt — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/resetpassword.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../js/resetpassword.js" defer></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: "#0B1220",
          brandblue: "#2E6FF2",
          brandgreen: "#17B978",
        },
        fontFamily: {
          sora: ["Sora", "sans-serif"],
          inter: ["Inter", "sans-serif"],
        },
      },
    },
  };
</script>
</head>
<body class="font-inter text-white antialiased">
<div class="bg-mesh"></div>

<div class="relative z-10 min-h-screen flex items-start md:items-center md:justify-center px-6">
  <div class="absolute top-6 left-6 hidden md:flex items-center gap-2">
    <img src="../assets/Trackit1.png" alt="TrackIt logo" class="rounded-full h-9">
    <span class="bg-gradient-to-r from-brandblue via-brandblue to-brandgreen bg-clip-text text-transparent font-sora font-bold text-xl">TrackIt</span>
  </div>

  <div class="w-full max-w-md py-8">

  <!-- Logo (mobile only) -->
  <div class="flex gap-2 mb-10 md:hidden">
    <span class="bg-gradient-to-r from-brandblue via-brandblue to-brandgreen bg-clip-text text-transparent font-sora font-bold text-xl">TrackIt</span>
  </div>

  <div id="request-view" class="state-view active">
    <h1 class="font-sora font-bold text-2xl sm:text-3xl mb-9">Enter a new password for your account</h1>
    <form id="reset-form" method="POST" action="" novalidate>
      <div class="mb-4 relative">
        <label for="newpassword" class="field-label">New password</label>
        <input id="newpassword" name="newpassword" type="password" class="field" placeholder="Enter a new password" />
        <span class="toggle-pass absolute right-4 top-[38px] text-slate-500 text-xs select-none" onclick="togglePassword('newpassword', this)">Show</span>
        <div id="password-meter" class="password-meter" aria-live="polite">
          <div class="password-meter-bar"></div>
          <span id="password-strength-text" class="password-strength-text">At least 8 characters</span>
        </div>
        <p class="error-text" data-error-for="newpassword">Password must be at least 8 characters</p>
      </div>

      <div class="mb-3 relative">
        <div class="flex items-center justify-between mb-1.5">
          <label class="field-label mb-0" for="confirmpassword">Confirm password</label>
        </div>
        <input id="confirmpassword" name="confirmpassword" type="password" class="field pr-12" placeholder="Confirm your new password" required />
        <span class="toggle-pass absolute right-4 top-[38px] text-slate-500 text-xs select-none" onclick="togglePassword('confirmpassword', this)">Show</span>
        <p id="confirm-password-status" class="match-text">Type your password again</p>
        <p class="error-text" data-error-for="confirmpassword">Passwords do not match</p>
      </div>

      <button type="submit" class="btn-primary w-full font-semibold mt-5 px-6 py-4 rounded-full bg-gradient-to-r from-brandblue to-brandgreen mb-6">
        Set password
      </button>
    </form>
  </div>

    <!-- STATE 2: Confirmation -->
  <div id="confirm-view" class="state-view hidden flex flex-col items-center text-center pt-7">
      <div class="icon-orb w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-8">
     <svg class="h-[100px] w-[100px] p-5"  xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#43db82" viewBox="2 2 20 20" >
<path d="M9 15.59 4.71 11.3 3.3 12.71l5 5c.2.2.45.29.71.29s.51-.1.71-.29l11-11-1.41-1.41L9.02 15.59Z"></path>
</svg>
    </div>
    <h1 class="font-sora font-bold text-2xl sm:text-3xl mb-3">Password successfully created</h1>
  <p class="text-slate-500 mb-8">you can now log in to your account.</p>
    <a href="./login.html" class="btn-ghost w-full text-center font-semibold px-6 py-4 rounded-full border border-white/15 text-slate-200 bg-gradient-to-r from-brandblue to-brandgreen hover:from-brandgreen hover:to-brandblue transition mb-6">
      Back to log in
    </a>
  </div>





  </div>

    <linearGradient id="paint0_linear" x1="12" y1="50" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0089FF"/>
      <stop offset="1" stop-color="#1DD75F"/>
    </linearGradient>
  </defs>
  <path d="M50 10C32.8 10 19 23.8 19 41C19 56.3 31.8 74.1 50 92.5C68.2 74.1 81 56.3 81 41C81 23.8 67.2 10 50 10ZM50 65C39.5 65 31 56.5 31 46C31 35.5 39.5 27 50 27C60.5 27 69 35.5 69 46C69 56.5 60.5 65 50 65Z" fill="url(#paint0_linear)"/>
  <path d="M36 44.8L45.2 54L64.8 34" stroke="#1DD75F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M25 74L37.3 61.3L49.6 65.6L62 50" stroke="url(#paint0_linear)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25" cy="74" r="3" fill="#0089FF"/>
  <circle cx="37" cy="61" r="3" fill="#0089FF"/>
  <circle cx="50" cy="66" r="3" fill="#1DD75F"/>
  <circle cx="62" cy="50" r="3" fill="#1DD75F"/>
</svg>
</div>


</body>
</html>
